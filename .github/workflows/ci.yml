name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy-test:
    name: Build, scan, deploy to kind, smoke test
    needs: [test, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pulse:dev .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulse:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pulse

      - name: Deploy
        run: |
          kind load docker-image pulse:dev --name pulse
          kubectl create namespace pulse
          kubectl label namespace pulse pod-security.kubernetes.io/enforce=restricted
          kubectl apply -k k8s
          kubectl -n pulse rollout status deploy/pulse --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n pulse port-forward svc/pulse 8080:80 &
          sleep 5
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/readyz
          curl -fsS localhost:8080/metrics | grep pulse_target_up

      - name: Show pod logs on failure
        if: failure()
        run: kubectl -n pulse logs -l app=pulse --tail=50

  publish:
    name: Push image to GHCR
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR rejects capitals)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulse" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
