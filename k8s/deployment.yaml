apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
  labels:
    app: pulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulse
          image: pulse:dev          # CI replaces this with the image it just built
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulse-config
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          livenessProbe:            # restart the container if the process hangs
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:           # only send traffic once the first check round is done
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
